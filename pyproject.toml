[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-runtime-inmem"
version = "0.33.3.post2"
description = "In-memory implementation for the LangGraph API server, patched with thread and store TTL support."
readme = "README.md"
requires-python = ">=3.11"
license = "Elastic-2.0"
authors = [{ name = "LangChain" }]
dependencies = [
  "blockbuster>=1.5.24,<2.0.0",
  "croniter>=1.0.1",
  "langgraph-checkpoint>=3,<5",
  "langgraph>=0.4.10,<2",
  "sse-starlette>=2",
  "starlette>=1.3.1",
  "structlog>23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
